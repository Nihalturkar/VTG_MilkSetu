services:
  - type: web
    name: vtgmilksetu
    runtime: node
    plan: free
    region: singapore
    # Install both workspaces, build the admin panel, then compile the API.
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_ADMIN
        value: "true"
      # Set these in the Render dashboard — never commit real values.
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: "180"
      - key: ADMIN_TOKEN_TTL_HOURS
        value: "12"
      # The admin panel is same-origin now, so this only needs to list any
      # extra browser origins you actually use.
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
